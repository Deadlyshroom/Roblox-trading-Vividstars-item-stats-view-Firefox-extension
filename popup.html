<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Quick settings</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <header>
    <strong>Quick settings</strong>
    <button id="editPins" type="button" class="ghost" title="Choose which settings appear here">Edit pins</button>
  </header>
  <p id="hint" class="hint" hidden></p>
  <div id="list"></div>
  <footer>
    <button id="openOptions" type="button">All settings</button>
    <span id="msg" role="status"></span>
  </footer>
  <script src="popup.js"></script>
</body>
</html>
